name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chromatix
          POSTGRES_PASSWORD: chromatix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chromatix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Qt runtime libraries (offscreen GUI test)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
          CHROMATIX_TEST_POSTGRES_URL: postgresql://chromatix:chromatix@localhost:5432/postgres
          CHROMATIX_REQUIRE_POSTGRES: "1"

  # Windows is a supported platform (macOS is deferred). Lint, formatting and types are
  # platform-independent and checked above; this job runs the test suite. GitHub only
  # supports service containers on Linux runners, so PostgreSQL cases skip here and are
  # covered by the Linux job.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

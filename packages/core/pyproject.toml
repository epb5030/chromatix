[project]
name = "chromatix-core"
version = "0.1.0.dev0"
description = "ChromaTix processing engine: file readers, peak detection, integration, calibration"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "netCDF4>=1.7.2",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chromatix_core"]

[project]
name = "chromatix-store"
version = "0.1.0.dev0"
description = "ChromaTix storage: audit-first data model on SQLite (personal) or PostgreSQL (shared)"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "chromatix-core",
    "sqlalchemy>=2.0.36",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
chromatix-admin = "chromatix_store.admin:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chromatix_store"]

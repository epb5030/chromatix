[project]
name = "chromatix-desktop"
version = "0.1.0.dev0"
description = "ChromaTix native desktop app (Qt / PySide6, no embedded web engine)"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "chromatix-core",
    "chromatix-store[postgres]",
    # PySide6-Essentials: Qt widgets without QtWebEngine (Chromium) - see docs/adr/0002
    "PySide6-Essentials>=6.8",
    "pyqtgraph>=0.13.7",
]

[project.scripts]
chromatix = "chromatix_desktop.app:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chromatix_desktop"]
